<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>ProctorAI — Student Records</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh
    }

    .layout {
      display: flex;
      flex: 1;
      overflow: hidden
    }

    .sidebar {
      width: 220px;
      flex-shrink: 0;
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 14px 0
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 10px
    }

    .sidebar-logo-icon {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: var(--blue-bg);
      border: 1px solid var(--blue-border);
      display: flex;
      align-items: center;
      justify-content: center
    }

    .sidebar-logo-text {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary)
    }

    .sidebar-logo-sub {
      font-size: 10px;
      color: var(--text-muted)
    }

    .nav-section {
      padding: 6px 12px 2px;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text-hint)
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 16px;
      margin: 1px 8px;
      border-radius: var(--radius-md);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all .15s;
      text-decoration: none;
      border: none;
      background: transparent;
      width: calc(100% - 16px)
    }

    .nav-item:hover {
      background: var(--bg-raised);
      color: var(--text-secondary)
    }

    .nav-item.active {
      background: var(--blue-bg);
      color: var(--blue-text);
      border: 1px solid var(--blue-border)
    }

    .nav-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0
    }

    .sidebar-bottom {
      margin-top: auto;
      padding: 12px 16px;
      border-top: 1px solid var(--border)
    }

    .user-chip {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .user-avatar {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--blue-dark), var(--green-hover));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-primary);
      flex-shrink: 0
    }

    .user-name {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-primary)
    }

    .user-role {
      font-size: 10px;
      color: var(--text-muted)
    }

    .logout-btn {
      margin-top: 10px;
      width: 100%;
      padding: 8px;
      border-radius: var(--radius-md);
      background: transparent;
      border: 1px solid var(--border-md);
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
      transition: all .15s;
      font-family: inherit
    }

    .logout-btn:hover {
      background: var(--red-bg);
      border-color: var(--red-border);
      color: var(--red-text)
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto
    }

    .page-header {
      padding: 20px 24px 0;
      border-bottom: 1px solid var(--border);
      background: var(--bg-surface)
    }

    .page-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 16px
    }

    .page-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary)
    }

    .page-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px
    }

    .content {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px
    }

    .table-wrap {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden
    }

    .data-table {
      width: 100%;
      border-collapse: collapse
    }

    .data-table th {
      padding: 10px 16px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-align: left;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      text-transform: uppercase;
      letter-spacing: .05em
    }

    .data-table td {
      padding: 12px 16px;
      font-size: 13px;
      border-bottom: 1px solid var(--border);
      color: var(--text-secondary);
      vertical-align: middle
    }

    .data-table tr:last-child td {
      border-bottom: none
    }

    .data-table tr:hover td {
      background: var(--border-faint)
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px
    }

    .stat-val {
      font-size: 28px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1
    }

    .stat-lbl {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px
    }

    .pass-badge {
      display: inline-flex;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid
    }

    .pass {
      background: var(--green-deep);
      border-color: var(--green-border);
      color: var(--green-text)
    }

    .fail {
      background: var(--red-bg);
      border-color: var(--red-border);
      color: var(--red-text)
    }

    .empty-state {
      padding: 48px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      color: var(--text-muted)
    }

    .empty-icon {
      font-size: 36px;
      opacity: .4
    }

    .empty-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary)
    }

    .spinner-wrap {
      padding: 40px;
      display: flex;
      justify-content: center
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 2px solid var(--border-md);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin .6s linear infinite
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      background: var(--bg-raised);
      border: 1px solid var(--border-md);
      border-radius: var(--radius-lg);
      padding: 12px 18px;
      font-size: 13px;
      color: var(--text-primary);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity .2s, transform .2s;
      pointer-events: none;
      max-width: 320px
    }

    #toast.show {
      opacity: 1;
      transform: translateY(0)
    }

    #toast.toast-err {
      border-color: var(--red-border);
      color: var(--red-text)
    }

    #toast.toast-ok {
      border-color: var(--green-border);
      color: var(--green-text)
    }
  </style>
</head>

<body>
  <div class="topbar">
    <svg width="20" height="20" viewBox="0 0 22 22" fill="none">
      <path d="M11 2L4 5v6c0 4.4 3 8.2 7 9 4-.8 7-4.6 7-9V5L11 2Z" stroke="#378ADD" stroke-width="1.2"
        fill="rgba(55,138,221,0.1)" />
    </svg>
    <span class="topbar-title">ProctorAI — Student Records</span>
    <div class="spacer"></div>
    <div class="pill pill-blue">
      <div class="dot dot-blue dot-sm"></div><span id="topbar-user">Teacher</span>
    </div>
  </div>
  <div class="layout">
    <nav class="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon"><svg width="18" height="18" viewBox="0 0 22 22" fill="none">
            <path d="M11 2L4 5v6c0 4.4 3 8.2 7 9 4-.8 7-4.6 7-9V5L11 2Z" stroke="#378ADD" stroke-width="1.2"
              fill="rgba(55,138,221,0.1)" />
          </svg></div>
        <div>
          <div class="sidebar-logo-text">ProctorAI</div>
          <div class="sidebar-logo-sub">Teacher Console</div>
        </div>
      </div>
      <div class="nav-section">Main</div>
      <a href="teacher-dashboard.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 16 16" fill="none">
          <rect x="2" y="2" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.2" />
          <rect x="9" y="2" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.2" />
          <rect x="2" y="9" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.2" />
          <rect x="9" y="9" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.2" />
        </svg>Dashboard</a>
      <a href="exam-management.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 16 16" fill="none">
          <rect x="2" y="2" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.2" />
          <path d="M5 6h6M5 9h4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
        </svg>Exam Management</a>
      <a href="create-exam.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.2" />
          <path d="M8 5v6M5 8h6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
        </svg>Create Exam</a>
      <div class="nav-section" style="margin-top:8px">Monitoring</div>
      <a href="live-monitoring.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.2" />
          <circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2 2" />
        </svg>Live Monitoring</a>
      <a href="exam-results.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 16 16" fill="none">
          <path d="M2 12V8M6 12V5M10 12V7M14 12V3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
        </svg>Results &amp; Reports</a>
      <a href="student-records.html" class="nav-item active"><svg class="nav-icon" viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="5" r="3" stroke="#378ADD" stroke-width="1.2" />
          <path d="M2 14c0-3 2.5-5 6-5s6 2 6 5" stroke="#378ADD" stroke-width="1.2" stroke-linecap="round" />
        </svg>Student Records</a>
      <div class="sidebar-bottom">
        <div class="user-chip">
          <div class="user-avatar" id="user-avatar">T</div>
          <div>
            <div class="user-name" id="user-name">Teacher</div>
            <div class="user-role">Teacher</div>
          </div>
        </div>
        <button class="logout-btn" onclick="logout()">Sign out</button>
      </div>
    </nav>
    <main class="main">
      <div class="page-header">
        <div class="page-header-row">
          <div>
            <div class="page-title" id="page-title">Student Records</div>
            <div class="page-sub" id="page-sub">All students who have taken your exams.</div>
          </div>
          <button class="btn" id="back-btn" style="display:none" onclick="showList()">← All Students</button>
        </div>
      </div>
      <div class="content" id="main-content">
        <div class="spinner-wrap">
          <div class="spinner"></div>
        </div>
      </div>
    </main>
  </div>
  <div id="toast"></div>
  <script>
    var token = localStorage.getItem('teacher_token');
    var user = null;
    try { user = JSON.parse(localStorage.getItem('teacher_user') || 'null'); } catch (_) { }
    if (!token || !user) { window.location.href = 'login.html'; }
    document.getElementById('topbar-user').textContent = user ? user.fullName : 'Teacher';
    document.getElementById('user-name').textContent = user ? user.fullName : 'Teacher';
    document.getElementById('user-avatar').textContent = user ? user.fullName.charAt(0).toUpperCase() : 'T';

    var BASE = 'http://localhost:4000';
    var allStudents = [];

    function api(path, opts) {
      return fetch(BASE + path, Object.assign({ headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' } }, opts || {})).then(function (r) { return r.json(); });
    }
    var toastTimer = null;
    function showToast(msg, type) { var t = document.getElementById('toast'); t.textContent = msg; t.className = 'show ' + (type === 'error' ? 'toast-err' : 'toast-ok'); clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.className = ''; }, 3500); }
    function escHtml(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

    function showList() {
      document.getElementById('page-title').textContent = 'Student Records';
      document.getElementById('page-sub').textContent = 'All students who have taken your exams.';
      document.getElementById('back-btn').style.display = 'none';
      renderList(allStudents);
    }

    function renderList(students) {
      var c = document.getElementById('main-content');
      if (students.length === 0) { c.innerHTML = '<div class="empty-state"><div class="empty-icon">👤</div><div class="empty-title">No student records yet</div><div style="font-size:12px;color:var(--text-muted)">Records appear when students complete your exams.</div></div>'; return; }
      var html = '<div class="table-wrap"><table class="data-table"><thead><tr><th>Student</th><th>Roll Number</th><th>Total Exams</th><th>Completed</th><th>Avg Score</th><th>Violations</th><th>Actions</th></tr></thead><tbody>';
      students.forEach(function (s) {
        var avgColor = s.avg_score >= 60 ? '#5DCAA5' : s.avg_score >= 40 ? '#FAC775' : '#FC8585';
        html += '<tr>' +
          '<td style="font-weight:500;color:var(--text-primary)">' + escHtml(s.student_name) + '</td>' +
          '<td>' + escHtml(s.student_roll) + '</td>' +
          '<td>' + s.total_exams + '</td>' +
          '<td>' + s.completed + '</td>' +
          '<td style="font-weight:600;color:' + avgColor + '">' + (s.avg_score || 0) + '%</td>' +
          '<td style="color:' + (s.total_violations > 0 ? '#FC8585' : '#5DCAA5') + '">' + (s.total_violations || 0) + '</td>' +
          '<td><button class="btn" style="font-size:11px" onclick="viewStudent(\'' + escHtml(s.student_roll) + '\',\'' + escHtml(s.student_name) + '\')">View History</button></td>' +
          '</tr>';
      });
      html += '</tbody></table></div>';
      c.innerHTML = html;
    }

    function viewStudent(roll, name) {
      document.getElementById('page-title').textContent = escHtml(name);
      document.getElementById('page-sub').textContent = 'Roll: ' + escHtml(roll) + ' — Exam history';
      document.getElementById('back-btn').style.display = 'inline-flex';
      document.getElementById('main-content').innerHTML = '<div class="spinner-wrap"><div class="spinner"></div></div>';
      api('/api/teacher/students/' + encodeURIComponent(roll)).then(function (data) {
        if (data.error) { showToast(data.error, 'error'); showList(); return; }
        var st = data.statistics || {};
        var sessions = data.sessions || [];
        var statsHtml = '<div class="stats-row" style="margin-bottom:20px">' +
          '<div class="stat-card"><div class="stat-val">' + st.totalExams + '</div><div class="stat-lbl">Total Exams</div></div>' +
          '<div class="stat-card"><div class="stat-val" style="color:#5DCAA5">' + st.completed + '</div><div class="stat-lbl">Completed</div></div>' +
          '<div class="stat-card"><div class="stat-val" style="color:#7BB8E8">' + st.avgScore + '%</div><div class="stat-lbl">Avg Score</div></div>' +
          '<div class="stat-card"><div class="stat-val" style="color:' + (st.totalViolations > 0 ? '#FC8585' : '#5DCAA5') + '">' + st.totalViolations + '</div><div class="stat-lbl">Total Violations</div></div>' +
          '</div>';
        var tableHtml = '<div class="table-wrap"><table class="data-table"><thead><tr><th>Exam</th><th>Subject</th><th>Score</th><th>Status</th><th>Violations</th><th>Risk</th><th>Date</th></tr></thead><tbody>';
        if (sessions.length === 0) { tableHtml = '<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-title">No exam sessions</div></div>'; }
        else {
          sessions.forEach(function (s) {
            var passed = s.status === 'submitted' && (s.score || 0) >= (s.exam_passing_marks || 0);
            var scoreStr = s.status === 'submitted' && s.score != null ? (s.score + '/' + s.exam_total_marks) : '-';
            tableHtml += '<tr>' +
              '<td style="font-weight:500;color:var(--text-primary)">' + escHtml(s.exam_title || 'Unknown') + '</td>' +
              '<td>' + escHtml(s.exam_subject || '-') + '</td>' +
              '<td style="font-weight:600">' + scoreStr + '</td>' +
              '<td>' + (s.status === 'submitted' ? '<span class="pass-badge ' + (passed ? 'pass' : 'fail') + '">' + (passed ? 'Pass' : 'Fail') + '</span>' : '<span class="pass-badge" style="background:var(--bg-raised);border-color:var(--border-md);color:var(--text-muted)">' + s.status + '</span>') + '</td>' +
              '<td style="color:' + (s.violations > 0 ? '#FC8585' : '#5DCAA5') + '">' + (s.violations || 0) + '</td>' +
              '<td>' + (s.risk_score || 0) + '%</td>' +
              '<td style="font-size:11px;color:var(--text-muted)">' + (s.started_at ? new Date(s.started_at).toLocaleDateString() : '-') + '</td>' +
              '</tr>';
          });
          tableHtml += '</tbody></table></div>';
        }
        document.getElementById('main-content').innerHTML = statsHtml + tableHtml;
      }).catch(function () { showToast('Failed to load student record.', 'error'); showList(); });
    }

    function logout() {
      fetch(BASE + '/api/auth/logout', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } }).catch(function () { }).finally(function () { localStorage.removeItem('teacher_token'); localStorage.removeItem('teacher_user'); window.location.href = 'login.html'; });
    }

    // Load students
    api('/api/teacher/students').then(function (students) {
      if (!Array.isArray(students)) { showToast('Failed to load students.', 'error'); document.getElementById('main-content').innerHTML = '<div class="empty-state"><div class="empty-icon">👤</div><div class="empty-title">No student records yet</div></div>'; return; }
      allStudents = students;
      renderList(students);
    }).catch(function () { showToast('Backend unreachable.', 'error'); });
  </script>
</body>

</html>
